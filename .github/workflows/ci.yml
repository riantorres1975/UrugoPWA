name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm y Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level high

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.e2e.placeholder
          NEXT_PUBLIC_SITE_URL: https://www.urugo.app

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas móviles
        run: pnpm test:e2e

  admin-integration:
    name: Moderación con Supabase aislado
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm y Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      - name: Iniciar Supabase y aplicar migraciones
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector > /dev/null

      - name: Probar moderación y auditoría
        env:
          ALLOW_TEST_SUPABASE_WRITES: "1"
        run: |
          status="$(supabase status -o json)"
          TEST_SUPABASE_URL="$(jq -er '.API_URL' <<< "$status")"
          TEST_SUPABASE_PUBLISHABLE_KEY="$(jq -er '.PUBLISHABLE_KEY' <<< "$status")"
          TEST_SUPABASE_SECRET_KEY="$(jq -er '.SECRET_KEY' <<< "$status")"
          echo "::add-mask::$TEST_SUPABASE_SECRET_KEY"
          export TEST_SUPABASE_URL TEST_SUPABASE_PUBLISHABLE_KEY TEST_SUPABASE_SECRET_KEY
          pnpm test:admin-integration
