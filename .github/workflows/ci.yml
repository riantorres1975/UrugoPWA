name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm y Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level high

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.e2e.placeholder
          NEXT_PUBLIC_SITE_URL: https://www.urugo.app

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas móviles
        run: pnpm test:e2e

  admin-integration:
    name: Moderación con Supabase aislado
    needs: verify
    runs-on: ubuntu-latest
    environment: integration-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar configuración aislada
        id: supabase-test
        shell: bash
        env:
          PROJECT_REF: ${{ secrets.TEST_SUPABASE_PROJECT_REF }}
          PROJECT_URL: ${{ secrets.TEST_SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
        run: |
          if [[ -n "$PROJECT_REF" && -n "$PROJECT_URL" && -n "$PUBLISHABLE_KEY" && -n "$SECRET_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Proyecto Supabase de pruebas configurado."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Prueba administrativa omitida: faltan secretos del entorno integration-test."
          fi

      - name: Instalar pnpm y Node.js
        if: steps.supabase-test.outputs.ready == 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Instalar dependencias
        if: steps.supabase-test.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        if: steps.supabase-test.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Probar moderación y auditoría
        if: steps.supabase-test.outputs.ready == 'true'
        run: pnpm test:admin-integration
        env:
          ALLOW_TEST_SUPABASE_WRITES: "1"
          TEST_SUPABASE_PROJECT_REF: ${{ secrets.TEST_SUPABASE_PROJECT_REF }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
