<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1710" />
    <title>UruGo | Sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at top, #233728, #0e1710 68%);
        color: #f5f6ed;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 460px);
        border: 1px solid #425644;
        border-radius: 16px;
        padding: 28px;
        background: #17261c;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .brand img { border-radius: 8px; }
      .brand strong { color: #d4f977; }

      h1 {
        margin: 0 0 10px;
        font-size: 1.8rem;
        letter-spacing: -.04em;
      }

      p {
        margin: 0;
        line-height: 1.45;
        color: #c3cec1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/icons/icon-192.png" width="32" height="32" alt="" />
        <span>Uru<strong>Go</strong></span>
      </div>
      <h1>Sin conexión</h1>
      <p>
        Estás sin internet en este momento. UruGo seguirá mostrando recursos cacheados y volverá a sincronizar cuando
        regreses en línea.
      </p>
    </main>
  </body>
</html>
